<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carte SafeCity</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    html, body, #map { height: 100%; margin: 0; background: #0b1220; }
    .leaflet-container { background: #0b1220; }
    .alert-popup b { color: #ef4444; }
    .legend {
      background: rgba(16,26,46,0.92); color: #e6ecf5; padding: 10px 12px;
      border-radius: 10px; font: 12px 'Segoe UI', sans-serif; line-height: 1.7;
      border: 1px solid #233250;
    }
    .legend i { display:inline-block; width:12px; height:12px; border-radius:50%;
      margin-right:6px; vertical-align:middle; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    var map = L.map("map", { zoomControl: true }).setView([-4.325, 15.3222], 13);
    // Fond de carte sombre (CARTO dark) avec repli OSM.
    L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
      attribution: "© OpenStreetMap © CARTO", maxZoom: 19, subdomains: "abcd",
    }).addTo(map);

    var URGENCY = { faible: "#22c55e", moyenne: "#eab308", haute: "#f97316", critique: "#ef4444" };
    var markers = {};     // id -> marker
    var patrolLayer = L.layerGroup().addTo(map);

    function alertIcon(urgency) {
      var c = URGENCY[urgency] || "#ef4444";
      return L.divIcon({
        className: "",
        html: '<div style="width:16px;height:16px;border-radius:50%;background:' + c +
              ';border:3px solid #0b1220;box-shadow:0 0 0 2px ' + c + ',0 0 12px ' + c + '"></div>',
        iconSize: [16, 16], iconAnchor: [8, 8],
      });
    }

    window.addAlert = function (a) {
      if (markers[a.id]) { map.removeLayer(markers[a.id]); delete markers[a.id]; }
      if (a.status === "cloturee") { return; }
      var m = L.marker([a.lat, a.lng], { icon: alertIcon(a.urgency) }).addTo(map);
      m.bindPopup(
        '<div class="alert-popup"><b>' + (a.type || "").toUpperCase() + "</b><br/>" +
        "Citoyen : " + (a.reporter_name || "Anonyme") + "<br/>" +
        "Quartier : " + (a.neighborhood || "—") + "<br/>" +
        "Heure : " + (a.time || "—") + "<br/>" +
        "Distance : " + (a.distance_m != null ? Math.round(a.distance_m) + " m" : "—") + "</div>"
      );
      markers[a.id] = m;
    };

    window.setAlerts = function (list) {
      Object.keys(markers).forEach(function (k) { map.removeLayer(markers[k]); });
      markers = {};
      (list || []).forEach(window.addAlert);
    };

    window.setPatrols = function (teams) {
      patrolLayer.clearLayers();
      (teams || []).forEach(function (t) {
        if (t.patrol_lat == null || t.patrol_lng == null) return;
        var icon = L.divIcon({
          className: "",
          html: '<div style="font-size:18px;filter:drop-shadow(0 0 3px #000)">🚓</div>',
          iconSize: [20, 20], iconAnchor: [10, 10],
        });
        L.marker([t.patrol_lat, t.patrol_lng], { icon: icon })
          .bindPopup("<b>" + t.name + "</b><br/>Statut : " + t.status)
          .addTo(patrolLayer);
      });
    };

    window.focusAlert = function (id) {
      var m = markers[id];
      if (m) { map.setView(m.getLatLng(), 16); m.openPopup(); }
    };

    // Agents suivis en temps réel.
    var agentLayer = L.layerGroup().addTo(map);
    var AVAIL = { available: "#22c55e", busy: "#f97316", offline: "#6b7280" };
    window.setAgents = function (agents) {
      agentLayer.clearLayers();
      (agents || []).forEach(function (a) {
        if (a.lat == null || a.lng == null) return;
        var c = AVAIL[a.availability] || "#6b7280";
        var icon = L.divIcon({ className: "",
          html: '<div style="position:relative;font-size:18px;filter:drop-shadow(0 0 3px #000)">👮' +
                '<span style="position:absolute;right:-2px;bottom:-2px;width:9px;height:9px;border-radius:50%;background:' +
                c + ';border:2px solid #0b1220"></span></div>',
          iconSize: [22, 22], iconAnchor: [11, 11] });
        L.marker([a.lat, a.lng], { icon: icon })
          .bindPopup("<b>" + a.name + "</b><br/>Disponibilité : " + a.availability +
                     (a.current_alert_id ? "<br/>Intervention #" + a.current_alert_id : ""))
          .addTo(agentLayer);
      });
    };

    // Légende de gravité
    var legend = L.control({ position: "bottomright" });
    legend.onAdd = function () {
      var div = L.DomUtil.create("div", "legend");
      div.innerHTML =
        '<i style="background:#22c55e"></i>Faible<br/>' +
        '<i style="background:#eab308"></i>Moyen<br/>' +
        '<i style="background:#f97316"></i>Élevé<br/>' +
        '<i style="background:#ef4444"></i>Critique';
      return div;
    };
    legend.addTo(map);

    document.title = "SafeCity map ready";
  </script>
</body>
</html>
